<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Van Training</title>
    <meta name="description" content="Log lifts, track progressive overload, and see what's up next." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- iOS home-screen app: full-screen, dark status bar, custom icon/name -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Van Training" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Splash shown until the bundle loads and auth resolves; App.tsx renders the same markup. -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        background: #0a0a0a;
      }
      .app-splash img {
        border-radius: 18px;
      }
      .app-splash-bar {
        position: relative;
        width: 76px;
        height: 3px;
        border-radius: 3px;
        background: #2b2b2b;
        overflow: hidden;
      }
      .app-splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: #f58426;
        animation: app-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-bar::after { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" role="status" aria-label="Loading Van Training">
        <img src="/icons/icon-192.png" alt="" width="76" height="76" />
        <span class="app-splash-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
